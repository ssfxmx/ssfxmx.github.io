<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B12" />

    <!-- Estas etiquetas son la plantilla por defecto. El script de
         prerenderizado (scripts/prerender.mjs) las sustituye por las de cada
         noticia, evento o tutorial al compilar, para que los enlaces
         compartidos en WhatsApp y Discord muestren título e imagen. -->
    <title>SSF2X México — Comunidad de Super Street Fighter II X</title>
    <meta name="description" content="La comunidad mexicana de Super Street Fighter II X Grand Master Challenge. Torneos mensuales, resultados, jugadores y guías." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SSF2X México" />
    <meta property="og:title" content="SSF2X México" />
    <meta property="og:description" content="Torneos mensuales, resultados y comunidad. Desde 1994, seguimos jugando." />
    <meta property="og:image" content="https://ssfxmx.github.io/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tipografías con licencia libre (SIL OFL).
         Press Start 2P: títulos cortos. Inter: cuerpo de texto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Fija el tema ANTES de pintar nada.
         Si esto se hiciera desde React, el navegador ya habría dibujado el
         fondo por defecto y quien tenga el modo claro vería un fogonazo negro
         en cada carga. Va en línea y sin async a propósito: bloquear un
         milisegundo aquí es preferible a ese parpadeo. -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('ssf2x-theme');
          var tema =
            guardado === 'light' || guardado === 'dark'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', tema);
          document.documentElement.style.colorScheme = tema;
          if (tema === 'light') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#F7F5EF');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
